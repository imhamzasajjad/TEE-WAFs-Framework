version: '3.8'

services:
  client:
    build:
      context: ./client
    volumes:
      - ./client/logs:/app/logs
      - ./client:/app/client
      - "./client/Dataset Analysis:/app/Dataset Analysis"
    networks:
      - app-network
    depends_on:
      - server
    environment:
      - ANALYZE_DATASET=${ANALYZE_DATASET:-no} # Set to yes to run analysis
      - PAYLOADS_FILE=${PAYLOADS_FILE:-client/Dataset/xss_payloads.csv} # Override for another dataset
      - NUM_SAMPLES=${NUM_SAMPLES:-2} # Number of payloads to test
      - NUM_FUZZING_ROUNDS=${NUM_FUZZING_ROUNDS:-2} # Fuzzing rounds per payload
      - PAYLOAD_SCOPE=${PAYLOAD_SCOPE:-malicious_only} # malicious_only or both
      - MAX_MUTATED_LENGTH=${MAX_MUTATED_LENGTH:-2048} # XSS mutation length cap
      - XSS_DILUTION=${XSS_DILUTION:-on} # off / on / <N> benign-padding target
      - RANDOM_SEED=${RANDOM_SEED:-} # fix payload selection for reproducible runs
      - FUZZER_TYPE=${FUZZER_TYPE:-xss} # sql (default) or xss/html/javascript
      - ML_WAF_PROVIDER=${ML_WAF_PROVIDER:-wafbrain} # ML provider used by ml_waf

  server:
    build:
      context: ./server
    ports:
      - "5000:5000"
    volumes:
      - ./server/logs:/app/logs
      - ./server:/app/server
    networks:
      - app-network
    depends_on:
      - rb_waf
      - ml_waf

  rb_waf:
    build:
      context: ./rb_waf
    networks:
      - app-network

  ml_waf:
    build:
      context: ./ml_waf
    environment:
      # Select the ML provider without changing the client/server wiring.
      # Select wafbrain, ml_based_waf, or xss_waf through .env.
      - ML_WAF_PROVIDER=${ML_WAF_PROVIDER:-wafbrain}
    ports:
      - "8000:8000"  # Map ML service port 8000 to host port 8000
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
